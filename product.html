<!DOCTYPE html>
<html lang="en">
<head>
  <!--
      Author: Memphis Mitchell
      Date: 11/01/2026
      Purpose: Product Details page for the VaultPixel Gear e-commerce project.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | VaultPixel Gear</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="index.html">VaultPixel Gear</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact</a>
      <a href="network.html">Network Test</a>
      <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
      <a href="checkout.html">Checkout</a>
    </nav>
  </div>
</header>
<main>
  <nav aria-label="Breadcrumb"><a href="shop.html">Shop</a> / <span>Product Details</span></nav>
  <section class="detail-grid" aria-labelledby="detailName">
    <div class="product-art" id="detailArt" aria-hidden="true">⌨</div>
    <article class="info-card">
      <p class="eyebrow" id="detailCategory">Loading...</p>
      <h1 id="detailName">Loading product...</h1>
      <p id="detailDescription"></p>
      <p class="price" id="detailPrice">$0.00</p>
      <p class="stock" id="detailStock"></p>
      <button type="button" id="detailAddCart">Add to Cart</button>
    </article>
  </section>
</main>
<footer class="site-footer">
  <p>&copy; 2026 VaultPixel Gear. Designed by Memphis Mitchell.</p>
</footer>
</body>
</html>
